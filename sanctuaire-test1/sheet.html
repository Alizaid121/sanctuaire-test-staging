<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanctuaire · Test 1 · Shared test sheet</title>
<style>
  :root {
    --bg: #eef1f5; --panel: #ffffff; --ink: #1b2430; --muted: #5b6676; --line: #d5dbe3;
    --accent: #2f6f8f; --good: #2f7d5b; --warn: #a86b12; --bad: #b4452f; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 44rem; margin: 0 auto; padding: 1rem 1rem 5rem; }
  h1 { font-size: 1.45rem; line-height: 1.25; margin: 0.75rem 0 0.25rem; }
  h2 { font-size: 1.05rem; margin: 1rem 0 0.4rem; }
  h3 { font-size: 0.98rem; margin: 0 0 0.25rem; }
  p { margin: 0.35rem 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; margin-top: 0.9rem; }
  .hidden { display: none !important; }
  label { display: block; font-weight: 600; margin: 0.7rem 0 0.25rem; }
  textarea, select, input[type="password"] {
    width: 100%; font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 0.55rem 0.65rem;
  }
  textarea { min-height: 4.2rem; resize: vertical; }
  textarea.short { min-height: 2.8rem; }
  button {
    font: inherit; min-height: 2.75rem; padding: 0.45rem 0.9rem; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: #fff; color: var(--accent); }
  button.danger { background: #fff; color: var(--bad); border-color: var(--bad); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid #f0b429; outline-offset: 2px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
  .row > * { flex: 1 1 auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: space-between; }
  .bar > div { min-width: 0; }
  .bar .row { margin: 0; }
  .bar button { min-height: 2.4rem; }
  .banner { padding: 0.7rem 0.85rem; border-radius: 8px; border: 1px solid var(--line); background: #fff; margin-top: 0.9rem; overflow-wrap: anywhere; }
  .banner.err { border-color: var(--bad); color: var(--bad); }
  .banner.ok { border-color: var(--good); color: var(--good); }
  .summary { background: #f3f6f9; border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.75rem; }
  .counts { display: flex; flex-wrap: wrap; gap: 0.35rem 1rem; margin-top: 0.3rem; font-size: 0.92rem; }
  details.cat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 0.7rem; }
  details.cat > summary { padding: 0.8rem 1rem; min-height: 3rem; display: flex; justify-content: space-between; gap: 0.5rem; cursor: pointer; font-weight: 700; list-style: none; }
  details.cat > summary::-webkit-details-marker { display: none; }
  details.cat > summary .prog { font-weight: 600; color: var(--muted); white-space: nowrap; }
  details.cat > .body { padding: 0 1rem 1rem; }
  .slot { border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem; margin-top: 0.6rem; background: #fbfcfd; }
  .slot-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
  .chip { font-size: 0.8rem; font-weight: 700; padding: 0.1rem 0.55rem; border-radius: 999px; border: 1px solid var(--line); background: #fff; white-space: nowrap; }
  .chip.written { color: var(--muted); }
  .chip.tested { color: var(--accent); border-color: var(--accent); }
  .chip.reviewed { color: var(--warn); border-color: var(--warn); }
  .chip.done { color: var(--good); border-color: var(--good); background: #e8f4ee; }
  .chip.empty { color: var(--muted); border-style: dashed; }
  .box { margin-top: 0.4rem; padding: 0.55rem 0.7rem; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; white-space: pre-wrap; overflow-wrap: anywhere; }
  .box small { display: block; color: var(--muted); }
  .rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.4rem; margin-top: 0.4rem; }
  .rate.two { grid-template-columns: repeat(2, 1fr); }
  .rate button { background: #fff; color: var(--ink); border-color: var(--line); line-height: 1.2; }
  .rate button[aria-pressed="true"] { border-width: 2px; font-weight: 700; }
  .rate button[data-v="good"][aria-pressed="true"], .rate button[data-v="kept"][aria-pressed="true"] { border-color: var(--good); background: #e8f4ee; }
  .rate button[data-v="awkward"][aria-pressed="true"] { border-color: var(--warn); background: #fbf1e0; }
  .rate button[data-v="wrong"][aria-pressed="true"], .rate button[data-v="changed"][aria-pressed="true"] { border-color: var(--bad); background: #fbe9e5; }
  .msg { min-height: 1.2rem; font-size: 0.88rem; color: var(--muted); margin-top: 0.3rem; overflow-wrap: anywhere; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
  .reviewline { font-size: 0.92rem; margin-top: 0.4rem; overflow-wrap: anywhere; }
  .files { margin-top: 0.6rem; display: grid; gap: 0.4rem; }
  .file { font-size: 0.85rem; }
  .file progress { width: 100%; height: 0.5rem; }
  details.plain > summary { cursor: pointer; font-weight: 600; min-height: 2.5rem; display: flex; align-items: center; }
  .vsel button { min-height: 3.4rem; font-size: 0.95rem; }
  .vsel button[aria-pressed="true"] { border-color: var(--good); background: #e8f4ee; color: var(--ink); }
  details.plain ol, details.plain ul, .card ol, .card ul { padding-left: 1.3rem; margin: 0.3rem 0; }
  .card li { margin: 0.25rem 0; }
  progress { height: 0.6rem; margin-top: 0.4rem; }
</style>

<main>
  <div id="cfg" class="banner err hidden"></div>

  <section id="view-login" class="card hidden">
    <h1>Sanctuaire · Test 1</h1>
    <p class="muted">Shared test sheet · Feuille de test partagée</p>
    <label for="pin">PIN / Code</label>
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="8">
    <div class="row"><button id="enter" type="button">Enter · Entrer</button></div>
    <div class="row"><button id="check" type="button" class="secondary">Check the connection · Vérifier la connexion</button></div>
    <div id="login-msg" class="msg" role="status" aria-live="polite"></div>
  </section>

  <div id="view-gate" class="hidden"></div>

  <div id="view-main" class="hidden">
    <header class="card">
      <div class="bar">
        <div>
          <h1 id="t-title"></h1>
          <div class="muted" id="who"></div>
        </div>
      </div>
      <p class="muted" id="how"></p>
      <div class="muted" id="updated" role="status"></div>
    </header>

    <section class="card" id="vpanel"></section>
    <section class="card" id="tpanel"></section>
    <section class="card" id="lpanel"></section>
    <section class="card" id="mpanel"></section>

    <section class="card">
      <div class="summary" id="summary"></div>
      <label for="filter" id="l-filter"></label>
      <select id="filter"></select>
    </section>


    <div id="cats"></div>
    <section class="card hidden" id="admin"></section>
  </div>
</main>

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {

    e.append(typeof kid === 'object' ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

async function rpc(fn, args) {
  const headers = { 'Content-Type': 'application/json', apikey: SUPABASE_KEY };
  if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = `Bearer ${SUPABASE_KEY}`;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers, body: JSON.stringify(args) });
  if (!res.ok) {
    let m = '';
    try { m = (await res.json()).message || ''; } catch { /* ignore */ }
    const err = new Error(`HTTP ${res.status}${m ? ': ' + m : ''}`);
    err.status = res.status;
    throw err;
  }
  return await res.json();
}

// What went wrong, in plain words plus the technical detail, so a failure can be diagnosed from a screenshot.
function explain(e) {
  if (e && e.status) return `HTTP ${e.status}: ${e.message.replace(/^HTTP \d+:?\s*/, '') || 'no details'}`;
  return `no answer from the server (${(e && e.message) || 'network error'})`;
}

    } else {

    }
  } catch (e) {
    box.className = 'msg err';
    let hint = '';
    if (!e.status) hint = ' Could not connect at all: check the internet, the Supabase status page, and that the project is running (not paused).';
    else if (e.status === 404) hint = ' The project answers, but the function was not found: the setup SQL did not run, or the API list needs a refresh.';
    else if (e.status === 401 || e.status === 403) hint = ' The project answered but refused the key: check the public key in this page.';
    box.textContent = `Problem: ${explain(e)}.${hint}`;
  }
}

// ---------- translator (runs on this phone) ----------
const TR_SETTINGS = 'sanctuaire-t1-translator-v1';
const tr = { translator: null, ready: false, engineKind: 'engine2', beam: 1, lex: false, records: null, cached: false, downloaded: 0 };
let MODEL_STORE = {};
const versionKey = (v) => String(v || '0').split('.').map((x) => String(parseInt(x, 10) || 0).padStart(4, '0')).join('.');
const isZstd = (u8) => u8.length > 4 && u8[0] === 0x28 && u8[1] === 0xb5 && u8[2] === 0x2f && u8[3] === 0xfd;
const isGzip = (u8) => u8.length > 2 && u8[0] === 0x1f && u8[1] === 0x8b;
const isLfsPointer = (u8) => new TextDecoder().decode(u8.slice(0, 40)).startsWith('version https://git-lfs');
const hex = (buf) => Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');

function concat(chunks, total) {
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

async function decode(u8, label) {
  if (isLfsPointer(u8)) throw new Error(`${label}: received a pointer file, not the real file.`);
  if (isZstd(u8)) {
    await pause();
    const out = zstdDecompress(u8);
    return out.buffer.slice(out.byteOffset, out.byteOffset + out.byteLength);
  }
  if (isGzip(u8)) {
    const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).arrayBuffer();
  }
  return u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
}

async function loadRecords() {
  if (tr.records) return tr.records;
  const res = await fetch(`${HF}/records.json`, { credentials: 'omit' });
  if (!res.ok) throw new Error(`The model list could not be fetched (HTTP ${res.status}).`);
  const data = await res.json();
  const arr = Array.isArray(data) ? data : (data.data || data.records || []);
  const best = {};
  for (const r of arr) {
    const name = r.name || r.attachment?.filename || '';
    const pair = (name.match(/\.(enfr|fren)\./) || [])[1] || `${r.sourceLanguage || ''}${r.targetLanguage || ''}`;
    if (pair !== 'enfr' && pair !== 'fren') continue;
    if (!['model', 'vocab', 'lex'].includes(r.fileType)) continue;
    const key = `${r.fileType}:${pair}`;
    if (!best[key] || versionKey(r.version) > versionKey(best[key].version)) best[key] = r;
  }
  tr.records = best;
  return best;
}

async function fetchBytes(url, onBytes) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 300000);
  try {
    const res = await fetch(url, { credentials: 'omit', signal: ctl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const total = Number(res.headers.get('content-length')) || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      got += value.length;
      onBytes(got, total);
    }
    return concat(chunks, got);
  } finally { clearTimeout(timer); }
}

function localCandidates(rec) {
  const names = new Set();
  if (rec?.attachment?.location) names.add(rec.attachment.location.split('/').pop());
  if (rec?.location) names.add(rec.location.split('/').pop());
  if (rec?.name) { names.add(`${rec.name}.zst`); names.add(rec.name); }
  const urls = [];
  for (const n of names) { urls.push(`./models/${n}`); urls.push(`./${n}`); }
  return urls;
}

function makeRow(name) {
  const bar = el('progress', { max: 100, value: 0 });
  const info = el('div', { class: 'muted', text: '…' });
  $('tfiles').append(el('div', { class: 'file' }, el('div', { text: name }), bar, info));
  return { bar, info };
}

async function getOne(type, pair, optional, opts = {}) {
  const key = `${type}:${pair}`;
  const row = makeRow(`${pair}: ${type === 'lex' ? LEX[pair].name : type}`);
  if (!opts.force) {
    const c = await store.get(key).catch(() => null);
    if (c && c.buffer) {
      row.bar.value = 100;
      row.info.textContent = `${mb(c.buffer.byteLength)} · ${t('fromStorage')}`;
      return c.buffer;
    }
  }
  if (opts.cacheOnly && type !== 'lex') { row.info.textContent = '—'; throw new Error(t('notStored')); }
  const records = opts.cacheOnly ? {} : await loadRecords();
  const rec = records[key] || (type === 'lex' ? { name: LEX[pair].name, location: LEX[pair].location } : null);
  const name = rec?.name || `${type}.${pair}`;
  const urls = localCandidates(rec);
  if (!opts.cacheOnly && type !== 'lex' && rec?.attachment?.location) urls.push(`${HF}/${rec.attachment.location}`);
  let raw = null;
  for (const url of urls) {
    try {
      raw = await fetchBytes(url, (got, total) => {
        row.bar.value = total ? Math.round((got / total) * 100) : 0;
        row.info.textContent = total ? `${mb(got)} / ${mb(total)}` : mb(got);
      });
      tr.downloaded += raw.length;
      break;
    } catch { raw = null; }
  }
  if (!raw) {
    if (optional) { row.info.textContent = '—'; return null; }
    row.info.textContent = 'Failed';
    throw new Error(`Could not get ${name}.`);
  }
  row.info.textContent = '…';
  const buf = await decode(raw, name);
  row.bar.value = 100;
  const expected = String(rec?.decompressedHash || '').toLowerCase();
  let note = '';
  if (expected && globalThis.crypto?.subtle) {
    note = hex(await crypto.subtle.digest('SHA-256', buf)) === expected ? ' ✓' : ' (checksum differs)';
  }
  row.info.textContent = `${mb(buf.byteLength)}${note}`;
  await store.put({ key, buffer: buf, name, version: rec?.version ?? null, bytes: buf.byteLength, savedAt: Date.now() }).catch(() => {});
  return buf;
}

async function getPair(pair, opts) {
  const model = await getOne('model', pair, false, opts);
  const vocab = await getOne('vocab', pair, false, opts);
  const lex = await getOne('lex', pair, true, opts);
  return { model, vocab, lex };
}

    }
    const backing = new LocalBacking({});
    tr.translator = tr.engineKind === 'engine2'
      ? new mod.LatencyOptimisedTranslator({ from: 'en', to: 'fr' }, {}, backing)
      : new mod.LatencyOptimisedTranslator({}, backing);
    await tr.translator.worker;
    await runTranslate('Hello, how are you?', 'en', 'fr');
    await runTranslate('Bonjour, comment allez-vous ?', 'fr', 'en');
    tr.lex = !!(MODEL_STORE['en>fr'].lex && MODEL_STORE['fr>en'].lex);
    tr.ready = true;
    tr.cached = await store.isComplete();
    if (tr.downloaded > 0) await store.persist();   // ask the browser to keep the stored models
    const secs = Math.round((performance.now() - t0) / 1000);
    setTStatus(tr.downloaded > 0 ? t('readyDownloaded', secs, Math.round(tr.downloaded / 1048576)) : t('readyStored', secs), 'ok');
    $('tdetails').open = false;
  } catch (e) {
    console.error(e);
    setTStatus(t('prepFail', e.message), 'err');
  } finally {
    btn.disabled = false; redo.disabled = false;
    updatePrepLabels();
  }
}

// ---------- sheet data ----------
const itemOf = (cat, author, slot) => sheet.items.find((i) => i.category_id === cat && i.author === author && i.slot === slot);

async function refresh(force) {
  if (!session) return;
  try {
    const r = await call(FN('get_sheet'), {});
    if (!r.ok) {
      if (r.error === 'auth') { showLogin(t('sessionEnded')); return; }
      return;
    }
    const changed = !sheet || JSON.stringify(sheet.items) !== JSON.stringify(r.items);

function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => {
    if (document.visibilityState !== 'visible' || busy > 0) return;
    const a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
    refresh(false);
  }, 8000);
}
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

// ---------- rendering ----------
function pendingCounts() {
  const me = session.role, them = other();
  const mine = sheet.items.filter((i) => i.author === me);
  const theirs = sheet.items.filter((i) => i.author === them);
  const total = sheet.categories.length * 3;
  return {
    toWrite: total - mine.length,
    toTest: mine.filter((i) => i.status === 'written').length,
    toReview: theirs.filter((i) => i.translation && !i.translation_rating).length,
    toCheck: mine.filter((i) => i.translation && !i.back_rating).length,
    done: sheet.items.filter((i) => i.status === 'done').length,
    totalSlots: total * 2,
  };
}

function categoryHasAction(cat) {
  for (let n = 1; n <= 3; n++) {
    const m = itemOf(cat.id, session.role, n), o = itemOf(cat.id, other(), n);
    if (!m || m.status === 'written' || (m.translation && !m.back_rating)) return true;
    if (o && o.translation && !o.translation_rating) return true;
  }
  return false;
}

function renderSheet() {
  const c = pendingCounts();
  const sum = $('summary');
  sum.textContent = '';
  sum.append(
    el('div', { text: t('doneCount', c.done, c.totalSlots) }),
    el('div', { class: 'counts' },
      el('span', { text: `${t('toWrite')}: ${c.toWrite}` }),
      el('span', { text: `${t('toTest')}: ${c.toTest}` }),
      el('span', { text: `${t('toReview')}: ${c.toReview}` }),
      el('span', { text: `${t('toCheck')}: ${c.toCheck}` })));

  const host = $('cats');
  const scrollY = window.scrollY;
  host.textContent = '';
  for (const cat of sheet.categories) {
    if (filterMode === 'action' && !categoryHasAction(cat)) continue;
    host.append(renderCategory(cat));
  }
  window.scrollTo(0, scrollY);
  renderAdmin();
}

function renderCategory(cat) {
  const doneN = sheet.items.filter((i) => i.category_id === cat.id && i.status === 'done').length;
  const d = el('details', { class: 'cat', open: openCats.has(cat.id) },
    el('summary', {}, el('span', { text: cat[t('cat')] }), el('span', { class: 'prog', text: `${doneN}/6` })));

function chip(status) {
  return el('span', { class: `chip ${status}`, text: t('st_' + status) });
}

function msgBox() { return el('div', { class: 'msg', role: 'status', 'aria-live': 'polite' }); }
function setMsg(box, text, kind) { box.textContent = text; box.className = 'msg' + (kind ? ' ' + kind : ''); }

function draftArea(key, initial, props = {}) {
  const ta = el('textarea', props);
  ta.value = drafts.has(key) ? drafts.get(key) : (initial || '');
  ta.addEventListener('input', () => drafts.set(key, ta.value));

function ratingButtons(key, values, labelKeys, current) {
  const wrap = el('div', { class: 'rate' + (values.length === 2 ? ' two' : '') });
  const chosen = draftRating.get(key) ?? current ?? null;
  for (const v of values) {
    const b = el('button', { type: 'button', 'data-v': v, 'aria-pressed': String(chosen === v), text: t(labelKeys[v]) });
    b.addEventListener('click', () => {
      draftRating.set(key, v);
      for (const x of wrap.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
      wrap.dispatchEvent(new Event('ratingchange'));
    });

}

function handleResult(r, box) {
  if (r && r.ok) return true;
  if (r && r.error === 'auth') { showLogin(t('sessionEnded')); return false; }
  setMsg(box, t('error', r?.error || 'unknown'), 'err');
  return false;
}

// ---------- unsaved changes (used by the save buttons, the leave guard and the draft kept when the app is closed) ----------
const itemById = (id) => (sheet ? sheet.items.find((i) => i.id === id) : null);
function dirtyEntries() {
  const out = [];
  if (!sheet || !session) return out;
  for (const [k, v] of drafts) {
    const kind = k.split(':')[0];
    let saved = null;
    if (kind === 'src') { const [, c, n] = k.split(':'); const it = itemOf(Number(c), session.role, Number(n)); saved = it ? it.source_text : ''; }
    else if (kind === 'note') { const it = itemById(k.slice(5)); if (it) saved = it.author_note || ''; }
    else if (kind === 'backremark') { const it = itemById(k.slice(11)); if (it) saved = it.back_remark || ''; }
    else if (kind === 'revremark') { const it = itemById(k.slice(10)); if (it) saved = it.translation_remark || ''; }
    if (saved === null) continue;
    if ((v || '').trim() !== saved.trim()) out.push({ kind, key: k, value: v });
  }
  for (const [k, v] of draftRating) {
    const kind = k.split(':')[0], it = itemById(k.slice(k.indexOf(':') + 1));
    if (!it || !v) continue;
    const saved = kind === 'back' ? it.back_rating : it.translation_rating;
    if (v !== saved) out.push({ kind, key: k, value: v });
  }
  return out;
}
const hasUnsaved = () => dirtyEntries().length > 0;
const askReplace = () => SUI.confirm({ title: t('confirmReplaceTitle'), text: t('confirmReplace'), ok: t('confirmReplaceOk'), cancel: t('cancel'), danger: true });

// Saves every unsaved change with the normal rules. Returns true when everything was saved.
async function saveAll() {
  const list = dirtyEntries();
  let ok = true;
  const reviews = new Set();
  busy++;
  try {
    for (const e of list) {
      if (e.kind === 'src') {
        const [, c, n] = e.key.split(':'), it = itemOf(Number(c), session.role, Number(n)), text = e.value.trim();
        if (!text) { ok = false; continue; }
        if (it && (it.translation_rating || it.back_rating) && !(await askReplace())) { ok = false; continue; }
        const r = await call(FN('save_item'), { p_category: Number(c), p_slot: Number(n), p_source: text });
        if (r && r.ok) drafts.delete(e.key); else ok = false;
      } else if (e.kind === 'note') {
        const r = await call(FN('set_note'), { p_item: e.key.slice(5), p_note: e.value });
        if (r && r.ok) drafts.delete(e.key); else ok = false;
      } else if (e.kind === 'back' || e.kind === 'backremark') reviews.add('back:' + e.key.slice(e.key.indexOf(':') + 1));
      else if (e.kind === 'rev' || e.kind === 'revremark') reviews.add('rev:' + e.key.slice(e.key.indexOf(':') + 1));
    }
    for (const rk of reviews) {
      const kind = rk.split(':')[0], id = rk.slice(rk.indexOf(':') + 1), it = itemById(id);
      if (!it) { ok = false; continue; }
      const back = kind === 'back';
      const rating = draftRating.get(rk) ?? (back ? it.back_rating : it.translation_rating);
      const remark = drafts.has((back ? 'backremark:' : 'revremark:') + id) ? drafts.get((back ? 'backremark:' : 'revremark:') + id) : ((back ? it.back_remark : it.translation_remark) || '');
      if (!rating) { ok = false; continue; }
      const r = await call(FN('rate'), { p_item: id, p_kind: back ? 'back' : 'translation', p_rating: rating, p_remark: remark });
      if (r && r.ok) { draftRating.delete(rk); drafts.delete((back ? 'backremark:' : 'revremark:') + id); } else ok = false;
    }
    await refresh(true);
  } catch (e) { ok = false; } finally { busy--; }
  return ok && !hasUnsaved();
}
function discardUnsaved() { drafts.clear(); draftRating.clear(); }

// ---------- helpers for the results of one sentence ----------
const POLISH = ['improved', 'unchanged', 'failed', 'skipped'];
function timeLabel(item, which) {
  if (VER !== '2') return t('ms', which === 'out' ? (item.ms_out ?? 0) : (item.ms_back ?? 0));
  const a = which === 'out' ? item.ms_out : item.ms_back, b = which === 'out' ? item.ms_polish : item.ms_back_polish;
  return b != null ? `${t('ms', a ?? 0)} + ${t('ms', b)}` : t('ms', a ?? 0);
}
function resultBoxes(item, label, which) {
  const text = which === 'out' ? item.translation : item.back_translation, draft = which === 'out' ? item.draft_translation : item.back_draft;
  const pol = which === 'out' ? item.polish_out : item.polish_back;
  const out = [el('div', { class: 'box' }, el('small', { text: `${label} · ${timeLabel(item, which)}` }), text || '')];
  if (VER === '2' && pol) {
    out.push(el('details', { class: 'plain' }, el('summary', { text: `${t('polish_' + pol)}` }),
      el('div', { class: 'box' }, el('small', { text: t('draftLabel') }), draft || ''),
      el('div', { class: 'box' }, el('small', { text: t('improvedLabel') }), text || '')));
  }
  return out;
}
// Shows Bergamot's draft at once and the language model's text as it is written. Returns small controls.
function liveBox(root) {
  const wrap = el('div', { class: 'box hidden' }), head = el('small'), body = el('div'), stat = el('div', { class: 'msg' });
  const skip = el('button', { type: 'button', class: 'secondary', text: t('cancelImprove') });
  wrap.append(head, body, stat, skip);
  root.append(wrap);
  return {
    draft(txt) { wrap.classList.remove('hidden'); head.textContent = t('draftLabel'); body.textContent = txt; stat.textContent = ''; skip.style.display = 'none'; },
    improving(handle) { stat.textContent = t('improving'); skip.style.display = ''; skip.onclick = () => { if (handle.cancel) handle.cancel(); }; },
    token(txt) { stat.textContent = `${t('improving')} ${txt}`; },
    hide() { wrap.classList.add('hidden'); },
  };
}

// Bergamot translates first; in version 2 the language model then fixes the draft.
async function pipeline(text, from, to, live) {
  const d = await runTranslate(text, from, to);
  if (VER !== '2') return { draft: d.text, text: d.text, msDraft: d.ms, msPolish: null, polish: null };
  if (!lm.ready) return { draft: d.text, text: d.text, msDraft: d.ms, msPolish: null, polish: 'skipped' };
  const handle = { cancelled: false };
  if (live) { live.draft(d.text); live.improving(handle); }
  const man = session.role === 'admin';                     // the English speaker is the man, the French speaker the woman
  let o;
  try {
    o = await llm.improve({ text, draft: d.text, from, to, writer: man ? 'man' : 'woman', reader: man ? 'woman' : 'man', handle, onToken: live ? (s) => live.token(s) : undefined });
  } catch (e) { console.error(e); o = { text: d.text, ms: 0, status: 'failed' }; }
  return { draft: d.text, text: o.text, msDraft: d.ms, msPolish: o.ms, polish: o.status };
}

// ---- one of my own sentences ----
function mineSlot(cat, n, item) {
  const key = `src:${cat.id}:${n}`;
  const box = msgBox();
  const status = item ? item.status : 'empty';
  const root = el('div', { class: 'slot' },
    el('div', { class: 'slot-head' },
      el('h3', { text: t('slot', n) + (item && item.attempt > 1 ? ` · ${t('version', item.attempt)}` : '') }),
      chip(status)));
  const ta = draftArea(key, item?.source_text, { placeholder: t('placeholderMine'), maxlength: '1000', 'aria-label': `${cat[t('cat')]} · ${t('slot', n)}` });
  root.append(ta);

  const saveBtn = el('button', { type: 'button', text: t('save') });
  const testBtn = el('button', { type: 'button', text: t('test') });
  const sv = SUI.save(saveBtn);
  const upd = () => sv.set(ta.value.trim() !== (item ? item.source_text : ''));
  ta.addEventListener('input', upd); upd();
  root.append(el('div', { class: 'row' }, saveBtn, testBtn), box);
  const live = liveBox(root);

  const confirmIfReviewed = async () => !(item && (item.translation_rating || item.back_rating)) || await askReplace();

  saveBtn.addEventListener('click', async () => {
    const text = ta.value.trim();
    if (!text) { setMsg(box, t('error', 'bad_text'), 'err'); return; }
    if (!(await confirmIfReviewed())) return;
    busy++; saveBtn.disabled = testBtn.disabled = true;
    try {
      const r = await call(FN('save_item'), { p_category: cat.id, p_slot: n, p_source: text });
      if (handleResult(r, box)) { drafts.delete(key); await refresh(true); }
    } catch { setMsg(box, t('netError'), 'err'); }
    finally { busy--; saveBtn.disabled = testBtn.disabled = false; }
  });

  testBtn.addEventListener('click', async () => {
    const text = ta.value.trim();
    if (!text) { setMsg(box, t('error', 'bad_text'), 'err'); return; }
    if (!tr.ready) { $('tdetails').open = true; setMsg(box, t('needTranslator'), 'err'); $('tpanel').scrollIntoView({ block: 'center' }); return; }
    if (VER === '2' && !lm.ready && !lm.failed) { const d = $('ldetails'); if (d) d.open = true; setMsg(box, t('needLlm'), 'err'); const p = $('lpanel'); if (p) p.scrollIntoView({ block: 'center' }); return; }
    if (!(await confirmIfReviewed())) return;
    busy++; saveBtn.disabled = testBtn.disabled = true;
    setMsg(box, t('translating'));
    try {
      const [from, to] = session.role === 'admin' ? ['en', 'fr'] : ['fr', 'en'];
      const a = await pipeline(text, from, to, live);
      live.hide();
      const b = await pipeline(a.text, to, from, live);
      live.hide();
      const args = VER === '2'
        ? { p_category: cat.id, p_slot: n, p_source: text, p_draft: a.draft, p_translation: a.text, p_polish_out: a.polish, p_back_draft: b.draft, p_back: b.text, p_polish_back: b.polish,
            p_ms_out: a.msDraft, p_ms_polish: a.msPolish, p_ms_back: b.msDraft, p_ms_back_polish: b.msPolish, p_engine: engineLabel(), p_device: deviceLabel() }
        : { p_category: cat.id, p_slot: n, p_source: text, p_translation: a.text, p_back: b.text, p_ms_out: a.msDraft, p_ms_back: b.msDraft, p_engine: engineLabel(), p_device: deviceLabel() };
      const r = await call(FN('save_item'), args);
      if (handleResult(r, box)) { drafts.delete(key); await refresh(true); }
    } catch (e) {
      console.error(e); live.hide();
      setMsg(box, `${e.message || t('netError')}`, 'err');
    } finally { busy--; saveBtn.disabled = testBtn.disabled = false; }
  });

  if (item && item.translation) {
    root.append(...resultBoxes(item, t('translation'), 'out'), ...resultBoxes(item, t('back'), 'back'));

    // note for the reviewer
    const nkey = `note:${item.id}`, nbox = msgBox();
    const nta = draftArea(nkey, item.author_note, { class: 'short', maxlength: '500', 'aria-label': t('noteLabel') });
    const nbtn = el('button', { type: 'button', text: t('saveNote') });
    const nsv = SUI.save(nbtn), nupd = () => nsv.set(nta.value.trim() !== (item.author_note || ''));
    nta.addEventListener('input', nupd); nupd();
    nbtn.addEventListener('click', async () => {
      busy++; nbtn.disabled = true;
      try {
        const r = await call(FN('set_note'), { p_item: item.id, p_note: nta.value });
        if (handleResult(r, nbox)) { drafts.delete(nkey); await refresh(true); }
      } catch { setMsg(nbox, t('netError'), 'err'); } finally { busy--; nbtn.disabled = false; }
    });
    root.append(el('label', { text: t('noteLabel') }), nta, el('div', { class: 'row' }, nbtn), nbox);

    // what the reviewer said
    root.append(el('div', { class: 'reviewline' },
      el('strong', { text: `${t('reviewedBy')}: ` }),
      item.translation_rating ? `${t(item.translation_rating)}${item.translation_remark ? ' · ' + item.translation_remark : ''}` : t('pending')));

    // my check of the back-translation
    const bkey = `back:${item.id}`, rkey = `backremark:${item.id}`, bbox = msgBox();
    const rta = draftArea(rkey, item.back_remark, { class: 'short', maxlength: '500', 'aria-label': t('remark') });
    const bsave = el('button', { type: 'button', text: t('saveCheck') });
    const bsv = SUI.save(bsave);
    const rate = ratingButtons(bkey, ['kept', 'changed'], { kept: 'kept', changed: 'changed' }, item.back_rating);
    const bupd = () => bsv.set((draftRating.get(bkey) ?? item.back_rating ?? null) !== (item.back_rating ?? null) || rta.value.trim() !== (item.back_remark || ''));
    rta.addEventListener('input', bupd); rate.addEventListener('ratingchange', bupd); bupd();
    bsave.addEventListener('click', async () => {
      const v = draftRating.get(bkey) ?? item.back_rating;
      if (!v) { setMsg(bbox, t('error', 'bad_rating'), 'err'); return; }
      busy++; bsave.disabled = true;
      try {
        const r = await call(FN('rate'), { p_item: item.id, p_kind: 'back', p_rating: v, p_remark: rta.value });
        if (handleResult(r, bbox)) { draftRating.delete(bkey); drafts.delete(rkey); await refresh(true); }
      } catch { setMsg(bbox, t('netError'), 'err'); } finally { busy--; bsave.disabled = false; }
    });
    root.append(el('label', { text: t('judgeBack') }), rate,
      el('label', { text: t('remark') }), rta, el('div', { class: 'row' }, bsave), bbox);
  }

  if (item && session.role === 'admin') root.append(deleteButton(item));
  return root;
}

// ---- one of the other person's sentences, for me to review ----
function theirSlot(cat, n, item) {
  const root = el('div', { class: 'slot' },
    el('div', { class: 'slot-head' },
      el('h3', { text: `${t('slot', n)} · ${t('authorWho', other())}` }),
      chip(item ? item.status : 'empty')));
  if (!item) { root.append(el('p', { class: 'muted', text: '—' })); return root; }

  const srcLang = item.author === 'admin' ? t('langEn') : t('langFr');
  root.append(el('div', { class: 'box' }, el('small', { text: `${t('sentIn')} ${srcLang}` }), item.source_text));
  if (item.author_note) root.append(el('div', { class: 'box' }, el('small', { text: t('theirNote') }), item.author_note));

  if (!item.translation) {
    root.append(el('p', { class: 'muted', text: t('notTestedYet') }));
  } else {
    root.append(el('div', { class: 'box' }, el('small', { text: t('translation') }), item.translation));
    if (VER === '2' && item.polish_out) root.append(el('details', { class: 'plain' }, el('summary', { text: t('polish_' + item.polish_out) }),
      el('div', { class: 'box' }, el('small', { text: t('draftLabel') }), item.draft_translation || '')));
    root.append(el('details', { class: 'plain' }, el('summary', { text: t('theirBack') }), el('div', { class: 'box' }, item.back_translation || '')));

    const key = `rev:${item.id}`, rkey = `revremark:${item.id}`, box = msgBox();
    const rta = draftArea(rkey, item.translation_remark, { class: 'short', maxlength: '500', 'aria-label': t('remark') });
    const save = el('button', { type: 'button', text: t('saveReview') });
    const sv = SUI.save(save);
    const rate = ratingButtons(key, ['good', 'awkward', 'wrong'], { good: 'good', awkward: 'awkward', wrong: 'wrong' }, item.translation_rating);
    const upd = () => sv.set((draftRating.get(key) ?? item.translation_rating ?? null) !== (item.translation_rating ?? null) || rta.value.trim() !== (item.translation_remark || ''));
    rta.addEventListener('input', upd); rate.addEventListener('ratingchange', upd); upd();
    save.addEventListener('click', async () => {
      const v = draftRating.get(key) ?? item.translation_rating;

async function switchVersion(v) {

// ---------- language model panel (version 2) ----------
function llmStatus(text, kind) { const s = $('lstatus'); if (s) { s.textContent = text; s.className = 'msg' + (kind ? ' ' + kind : ''); } }
function buildLlmPanel() {
  const p = $('lpanel');
  p.textContent = '';
  const d = el('details', { class: 'plain', id: 'ldetails', open: !lm.ready },
    el('summary', { text: t('llmTitle') }),
    el('p', { class: 'muted', text: t('llmHelp') }),
    el('p', { class: 'muted', id: 'lsize' }),
    el('div', { class: 'row' }, el('button', { id: 'lprep', type: 'button', text: lm.stored ? t('llmStart') : t('llmPrepare'), onclick: prepareLlm })),
    el('progress', { id: 'lbar', max: '100', value: '0', class: 'hidden', style: 'width:100%' }),
    el('div', { id: 'lstatus', class: 'msg', role: 'status', 'aria-live': 'polite', text: lm.ready ? t('llmReady', 0, lm.dtype) : t('llmNotReady') }));
  p.append(d);
  if (!lm.stored && !lm.ready) llm.downloadSize().then((s) => {
    const e = $('lsize'); if (!e) return;
    lm.sizeBytes = s.bytes || 0;
    e.textContent = s.bytes ? t('llmSize', Math.round(s.bytes / 1048576)) : t('llmSizeUnknown');
  }).catch(() => { const e = $('lsize'); if (e) e.textContent = t('llmSizeUnknown'); });
}
async function prepareLlm() {
  if (lm.loading || lm.ready) return;
  const btn = $('lprep'), bar = $('lbar');
  lm.loading = true; lm.failed = false;
  btn.disabled = true; bar.classList.remove('hidden');
  const t0 = performance.now();
  llmStatus(t('llmPreparing'));
  try {
    await llm.load({ onProgress: (p) => {
      const got = Math.round(p.allLoaded / 1048576);
      if (lm.sizeBytes) { bar.value = Math.min(99, Math.round((p.allLoaded / lm.sizeBytes) * 100)); llmStatus(t('llmDownloading', got, Math.round(lm.sizeBytes / 1048576))); }
      else llmStatus(t('llmDownloadingUnknown', got));
    } });
    llmStatus(t('llmPreparing'));
    // one tiny real run: proves the model works on this phone and warms it up
    await llm.improve({ text: 'Hello, my friend.', draft: 'Bonjour, mon ami.', from: 'en', to: 'fr', writer: 'man', reader: 'woman', handle: {} });
    lm.ready = true; lm.stored = true; lm.dtype = llm.status().dtype || '';
    bar.value = 100;
    llmStatus(t('llmReady', Math.round((performance.now() - t0) / 1000), lm.dtype), 'ok');
    const d = $('ldetails'); if (d) d.open = false;
  } catch (e) {
    console.error(e);
    lm.failed = true; lm.ready = false;
    llmStatus(t('llmFail', (e && e.message) || String(e)), 'err');
  } finally {
    lm.loading = false; btn.disabled = false;
    btn.textContent = lm.stored ? t('llmStart') : t('llmPrepare');
    refreshModelManager();
  }
}
async function autoStartLlm() {
  try { lm.stored = await llm.isStored(); } catch { lm.stored = false; }
  const b = $('lprep'); if (b) b.textContent = lm.stored ? t('llmStart') : t('llmPrepare');
  if (lm.stored && !lm.ready && !lm.loading && VER === '2') prepareLlm();
}

// ---------- manage stored models ----------
function saveBlobAs(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function buildModelManager() {
  const p = $('mpanel');
  p.textContent = '';
  p.append(el('details', { class: 'plain', id: 'mdetails' },
    el('summary', { text: t('mmTitle') }),
    el('p', { class: 'muted', text: t('mmHelp') }),
    el('div', { id: 'mlist' }),
    el('div', { id: 'mpersist', class: 'muted' }),
    el('div', { id: 'mmsg', class: 'msg', role: 'status', 'aria-live': 'polite' })));
  refreshModelManager();
}
async function refreshModelManager() {
  const list = $('mlist'); if (!list) return;
  const rows = [];
  let berg = [], files = [];
  try { berg = (await store.all()) || []; } catch { berg = []; }
  try { files = await llm.storedFiles(); } catch { files = []; }
  const msg = (text, kind) => { const m = $('mmsg'); m.textContent = text; m.className = 'msg' + (kind ? ' ' + kind : ''); };
  const row = (title, bytes, onDelete, onSave, onLoad) => {
    const file = el('input', { type: 'file', class: 'hidden', accept: '.smdl,application/octet-stream' });
    file.addEventListener('change', async () => {
      const f = file.files && file.files[0]; if (!f) return;
      msg(t('mmBusy'));
      try { const n = await onLoad(f); msg(t('mmLoaded', n), 'ok'); } catch (e) { msg(t('mmFail', e.message || String(e)), 'err'); }
      file.value = ''; refreshModelManager();
    });
    return el('div', { class: 'slot' },
      el('h3', { text: title }), el('div', { class: 'muted', text: bytes ? `${(bytes / 1048576).toFixed(1)} MB` : t('mmEmpty') }),
      el('div', { class: 'row' },
        bytes ? el('button', { type: 'button', class: 'secondary', text: t('mmSave'), onclick: async () => { msg(t('mmBusy')); try { await onSave(); } catch (e) { msg(t('mmFail', e.message || String(e)), 'err'); } } }) : null,
        el('button', { type: 'button', class: 'secondary', text: t('mmLoad'), onclick: () => file.click() }),
        bytes ? el('button', { type: 'button', class: 'danger', text: t('mmDelete'), onclick: async () => {
          if (!(await SUI.confirm({ title: t('mmDeleteTitle'), text: t('mmDeleteText', title), ok: t('mmDelete'), cancel: t('cancel'), danger: true }))) return;
          try { await onDelete(); msg(t('mmDeleted'), 'ok'); } catch (e) { msg(t('mmFail', e.message || String(e)), 'err'); }
          refreshModelManager();
        } }) : null),
      file);
  };
  const bergBytes = berg.reduce((s, r) => s + (r.bytes || (r.buffer ? r.buffer.byteLength : 0)), 0);
  rows.push(row(t('mmBerg'), bergBytes,
    async () => { await store.clear(); tr.cached = false; tr.ready = false; if (tr.translator) { try { await tr.translator.delete(); } catch { /* ignore */ } tr.translator = null; } updatePrepLabels(); },
    async () => { const b = await store.exportBlob(); saveBlobAs(b, 'sanctuaire-bergamot-models.smdl'); msg(t('mmSaved', 'sanctuaire-bergamot-models.smdl'), 'ok'); },
    async (f) => { const n = await store.importFile(f); tr.cached = await store.isComplete(); updatePrepLabels(); return n; }));
  const llmBytes = files.reduce((s, f) => s + f.size, 0);
  rows.push(row(t('mmLlm'), llmBytes,
    async () => { await llm.deleteStored(); lm.ready = false; lm.stored = false; buildLlmPanel(); },
    async () => { const b = await llm.exportBlob(); saveBlobAs(b, 'sanctuaire-gemma-270m.smdl'); msg(t('mmSaved', 'sanctuaire-gemma-270m.smdl'), 'ok'); },
    async (f) => { const n = await llm.importFile(f); lm.stored = true; buildLlmPanel(); return n; }));
  list.textContent = ''; list.append(...rows);
  let persisted = false; try { persisted = !!(navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()); } catch { /* ignore */ }
  $('mpersist').textContent = persisted ? t('mmPersistYes') : t('mmPersistNo');
}

// ---------- the guide that must be read once ----------
let gateShown = false;
function renderGate(failed) {
  const g = (window.SGUIDE_T1 && (window.SGUIDE_T1[LANG] || window.SGUIDE_T1.en)) || { title: 'Test 1', purpose: '', steps: [], tips: [] };
  const mine = session && session.role === 'admin' ? g.a : g.p;
  const v = $('view-gate');
  v.textContent = '';
  const read = el('button', { type: 'button', id: 'gread', text: t('gateRead'), disabled: true });
  const msg = el('div', { class: 'msg', role: 'status' });
  const sentinel = el('div', { style: 'height:1px' });
  const hint = el('p', { class: 'muted', text: t('gateScroll') });
  const card = el('section', { class: 'card' },
    el('h1', { text: t('gateTitle') }), el('p', { text: t('gateLead') }),
    el('h2', { text: g.title }),
    el('h3', { text: t('gatePurpose') }), el('p', { text: g.purpose }),
    el('h3', { text: t('gateSteps') }), el('ol', {}, (g.steps || []).map((s) => el('li', { text: s }))),
    mine && mine.length ? [el('h3', { text: t('gateYou') }), el('ul', {}, mine.map((s) => el('li', { text: s })))] : null,
    g.tips && g.tips.length ? [el('h3', { text: t('gateTips') }), el('ul', {}, g.tips.map((s) => el('li', { text: s })))] : null,
    sentinel, hint, el('div', { class: 'row' }, read), msg);
  v.append(card);
  if (failed) setMsg(msg, t('netError'), 'err');
  const unlock = () => { read.disabled = false; hint.classList.add('hidden'); };
  if ('IntersectionObserver' in window) { const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { unlock(); io.disconnect(); } }); io.observe(sentinel); }
  else setTimeout(unlock, 4000);
  read.addEventListener('click', async () => {
    read.disabled = true; setMsg(msg, t('gateSaving'));
    try {
      const r = await call('t1_guide', { p_key: GUIDE_KEY, p_ack: true });
      if (r && r.ok && r.acked) { gateShown = false; v.classList.add('hidden'); await start(); }
      else if (r && r.error === 'auth') showLogin(t('sessionEnded'));
      else { read.disabled = false; setMsg(msg, t('error', (r && r.error) || 'unknown'), 'err'); }
    } catch (e) { read.disabled = false; setMsg(msg, t('netError'), 'err'); }
  });
}
// resolves true when the guide was already confirmed; otherwise shows it and resolves false
async function guideGate() {
  let r;
  try { r = await call('t1_guide', { p_key: GUIDE_KEY }); } catch (e) { r = null; }
  if (r && r.error === 'auth') { showLogin(t('sessionEnded')); return false; }
  if (r && r.ok && r.acked) return true;
  gateShown = true;
  $('view-main').classList.add('hidden');
  const v = $('view-gate'); v.classList.remove('hidden');
  renderGate(!(r && r.ok));
  window.scrollTo(0, 0);
  return false;
}

// ---------- PDF report ----------
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el2 = document.createElement('script');
    el2.src = src;
    el2.onload = resolve;
    el2.onerror = () => reject(new Error(`Could not load ${src}`));
    document.head.append(el2);
  });
}
async function fetchBase64(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`);
  const u8 = new Uint8Array(await res.arrayBuffer());
  let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}
